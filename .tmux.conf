#
# From Han Boetes.

set -g default-command zsh
set -g status-right "#(uptime|awk '{print $11}') #(date)"

#set-option -g default-terminal "screen-256color"
set -g default-terminal screen-256color


# enable mouse
#set-option -g mouse on
set -g mouse on
# enable scrolling
set-option -g history-limit 3000



# Statusbar properties.
set -g display-time 3000
set -g status-bg black
set -g status-fg cyan
set-window-option -g window-status-current-style "fg=black,bg=cyan,bright"

# Use c-t instead of c-b as the prefix
unbind C-b
set -g prefix C-t
bind C-t send-prefix
bind t send-prefix

# Bind function keys.
bind -n F1 select-window -t 1
bind -n F2 select-window -t 2
bind -n F3 select-window -t 3
bind -n F4 select-window -t 4
bind -n F5 select-window -t 5
bind -n F6 select-window -t 6
bind -n F7 select-window -t 7
bind -n F8 select-window -t 8

bind -n End send-key C-e
bind -n Home send-key C-a

# German Mac keyboard-friendly bindings
# Splits: [ and ] require Option+5/6 on German Mac — use - and _ instead
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"

# Pane navigation (vim-style, with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane navigation without prefix: Alt+arrow
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Pane resize (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode: [ requires Option+5 on German Mac — use e instead
bind e copy-mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Paste: ] requires Option+6 on German Mac — use p instead
bind p paste-buffer

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Claude Code: open in a new window
bind g new-window "claude --continue"   # resume last session
bind G new-window "claude --resume"     # pick a session

# All new windows started at startup.
new htop
neww
neww
neww
neww

select-window -t 1





